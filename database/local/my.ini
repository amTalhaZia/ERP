# Project-local MySQL 8.4 configuration (development only).
# Started by database/local/start.ps1 as a plain user process — not a service.
# Paths below are rewritten by init.ps1 to absolute paths for this checkout.

[mysqld]
basedir   = "C:/Program Files/MySQL/MySQL Server 8.4"
datadir   = "__DATADIR__"
port      = 3306
bind-address = 127.0.0.1
mysqlx    = OFF

character-set-server  = utf8mb4
collation-server      = utf8mb4_0900_ai_ci
default-time-zone     = '+00:00'
sql-mode = "STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"

innodb_buffer_pool_size = 256M
innodb_redo_log_capacity = 128M
innodb_flush_log_at_trx_commit = 2
max_connections = 100
lower_case_table_names = 2

log-error = "__LOCALDIR__/mysql-error.log"
general-log = 0
slow-query-log = 1
slow-query-log-file = "__LOCALDIR__/mysql-slow.log"
long_query_time = 1

[client]
port = 3306
host = 127.0.0.1
default-character-set = utf8mb4
