; /etc/supervisor/conf.d/erp.conf

[program:erp-queue]
command=php /srv/erp/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/erp-queue.log

[program:erp-web]
command=/usr/bin/npm run start -- -p 3000
directory=/srv/erp/frontend
user=www-data
environment=NODE_ENV="production"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/erp-web.log
